<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DESAFIO 24</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px;background:linear-gradient(180deg,#0b1b33,#07111f)}.logo{font-size:30px;font-weight:900}.logo b{color:#43d8ff}.muted{color:#91a8bf}.card{background:#10243d;border:1px solid #20415f;border-radius:24px;padding:20px;margin-top:18px}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:#173b59;color:#9deaff;font-size:13px}.timer{text-align:center;font-size:46px;font-weight:900;color:#43d8ff}.q{font-size:22px;font-weight:800;line-height:1.25;margin:18px 0}button,input{width:100%;padding:15px;border-radius:14px;font-size:16px}button{border:0;background:#18c8f0;color:#04101a;font-weight:900;margin-top:10px}button.alt{background:#193550;color:white}button:disabled{opacity:.65}input{background:#09182a;border:1px solid #31526e;color:white}.hidden{display:none}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.rank{padding:12px 0;border-bottom:1px solid #25445f}.score{font-size:44px;font-weight:900}
</style></head><body><main class="app"><div class="row"><div><div class="logo">DESAFIO <b>24</b></div><div class="muted">Jogue. Supere. Compartilhe.</div></div><span class="pill">1.2</span></div>
<section id="home" class="card"><h2>Comece seu desafio</h2><input id="name" maxlength="24" placeholder="Seu nome"><button onclick="start()">JOGAR AGORA</button><button class="alt" onclick="ranking()">🏆 RANKING GLOBAL</button></section>
<section id="game" class="card hidden"><div class="row"><span id="cat" class="pill"></span><span id="count" class="muted"></span></div><div id="timer" class="timer">24</div><div id="q" class="q"></div><div id="opts"></div></section>
<section id="result" class="card hidden"><div class="muted">RESULTADO</div><div id="score" class="score"></div><p id="summary"></p><button onclick="ranking()">🏆 VER RANKING</button><button class="alt" onclick="start()">JOGAR NOVAMENTE</button><button class="alt" onclick="share()">🔗 DESAFIAR UM AMIGO</button></section>
<section id="rank" class="card hidden"><div class="row"><h2>Ranking global</h2><button style="width:auto;margin:0" class="alt" onclick="home()">Voltar</button></div><div id="list"><p class="muted">Carregando...</p></div></section>
</main><script>
let qs=[],i=0,pts=0,ok=0,left=24,timer,player="";
const $=x=>document.getElementById(x);function hide(){["home","game","result","rank"].forEach(x=>$(x).classList.add("hidden"))}function home(){hide();$("home").classList.remove("hidden")}
async function load(){try{qs=await fetch("/api/questions").then(r=>r.json())}catch(e){qs=[]}}load();
async function start(){if(!qs.length)await load();player=$("name").value.trim()||"Jogador";i=0;pts=0;ok=0;hide();$("game").classList.remove("hidden");showQ()}
function showQ(){let x=qs[i];$("cat").textContent=x.category;$("count").textContent=`${i+1}/${qs.length}`;$("q").textContent=x.question;$("opts").innerHTML=x.options.map((o,n)=>`<button onclick="answer(${n})">${o}</button>`).join("");left=24;$("timer").textContent=24;clearInterval(timer);timer=setInterval(()=>{left--;$("timer").textContent=left;if(left<=0)answer(-1)},1000)}
function answer(n){clearInterval(timer);let x=qs[i],bs=[...$("opts").children];bs.forEach(b=>b.disabled=true);if(n===x.answer){ok++;pts+=100+left*4}else if(n>=0){}setTimeout(()=>{i++;i<qs.length?showQ():finish()},400)}
async function finish(){hide();$("result").classList.remove("hidden");$("score").textContent=pts.toLocaleString("pt-BR")+" pts";$("summary").textContent=`${player}, você acertou ${ok} de ${qs.length}.`;await fetch("/api/score",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:player,score:pts})})}
async function ranking(){hide();$("rank").classList.remove("hidden");let a=await fetch("/api/ranking").then(r=>r.json());$("list").innerHTML=a.length?a.map((x,n)=>`<div class="rank"><b>${n+1}º ${esc(x.name)}</b><span style="float:right">${x.score.toLocaleString("pt-BR")} pts</span></div>`).join(""):"<p class='muted'>Ainda não há jogadores.</p>"}
function share(){let t=`Eu fiz ${pts.toLocaleString("pt-BR")} pontos no DESAFIO 24. Você consegue superar?`;navigator.share?navigator.share({title:"DESAFIO 24",text:t,url:location.href}):navigator.clipboard?.writeText(t)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
